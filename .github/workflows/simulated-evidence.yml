name: simulated-evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/run_evidence_pack.py --output artifacts/evidence/simulated-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-evidence-${{ github.sha }}
          path: artifacts/evidence/simulated-evidence.json
          if-no-files-found: error
