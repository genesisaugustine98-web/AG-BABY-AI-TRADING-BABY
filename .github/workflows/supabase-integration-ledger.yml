name: supabase-integration-ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      EXECUTION_ENV: research
    steps:
      - uses: actions/checkout@v4

      - name: Publish lifecycle event
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Supabase ledger secrets are not configured; skipping external publish safely."
            exit 0
          fi

          python - <<'PY'
          import os
                   from integrations.supabase_ledger import build_event, publish_event

          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{run_id}"
          event = build_event(
              integration_name="github",
              run_id=run_id,
              correlation_id=run_id,
              status="success",
              artifact_uri=run_url,
          )
          result = publish_event(event)
          print({"status_code": result["status_code"], "integration": event.integration_name, "environment": event.environment})
          PY
