name: USDJPY executable-data replication

on:
  push:
    paths:
      - ".github/workflows/usdjpy-executable-replication.yml"
      - "scripts/replicate_usdjpy_on_dukascopy.py"
      - "scripts/replicate_usdjpy_on_dukascopy_fast.py"
      - "scripts/backfill_h10_release_pages.py"
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire validated H.10 release archive
        run: |
          python scripts/backfill_h10_release_pages.py \
            --from-year 2011 \
            --to-year 2026 \
            --output-dir artifacts/h10/vintages

      - name: Verify H.10 archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/h10/vintages/archive_manifest.json")
          d = json.loads(p.read_text())
          assert d["revision_status"] == "point_in_time_release_page"
          assert d["release_count"] >= 700
          print({"release_count": d["release_count"], "candidate_date_count": d["candidate_date_count"]})
          PY

      - name: Replicate against executable bid/ask ticks
        run: |
          python scripts/replicate_usdjpy_on_dukascopy_fast.py \
            --h10-dir artifacts/h10/vintages \
            --from-date 2011-01-01 \
            --to-date 2026-09-30 \
            --latencies 0,30,60,300 \
            --slippage-bps 0,1,2,5 \
            --output-dir artifacts/usdjpy_executable

      - name: Validate executable report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/usdjpy_executable/report.json")
          d = json.loads(p.read_text())
          assert d["experiment"].startswith("usdjpy_h10_high_vol_5release_momentum_executable")
          assert d["high_regime_signal_count"] > 0
          assert len(d["results"]) == 16
          assert len(d["market_data_errors"]) == 0, d["market_data_errors"]
          by_latency = {}
          for r in d["results"]:
              by_latency[r["latency_seconds"]] = r
          assert len(by_latency) == 4
          for latency, r in sorted(by_latency.items()):
              assert r["coverage"]["eligible_signal_count"] == d["high_regime_signal_count"]
              assert r["coverage"]["complete"], {
                  "latency": latency,
                  "coverage": r["coverage"],
              }
          completed = [r for r in d["results"] if r["summary"]["n"] == d["high_regime_signal_count"]]
          assert len(completed) == 16, "Every configuration must contain the full candidate sample"
          print({
              "signal_count": d["high_regime_signal_count"],
              "unique_market_days": d["unique_market_days_requested"],
              "configs": len(d["results"]),
              "full_sample_configs": len(completed),
              "missing_404_buckets": d["market_data_missing_404_count"],
          })
          PY

      - name: Upload executable replication artifact
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-executable-replication
          path: artifacts/usdjpy_executable
          if-no-files-found: error
          retention-days: 30
